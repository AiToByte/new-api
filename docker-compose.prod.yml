# Production overlay for the custom/main line (PostgreSQL 15 baseline).
#
# Usage:
#   export POSTGRES_PASSWORD='<strong-pg-password>'
#   export REDIS_PASSWORD='<strong-redis-password>'
#   export SESSION_SECRET='<64+ random chars>'
#   export CRYPTO_SECRET='<64+ random chars, DIFFERENT from SESSION_SECRET>'
#   export PUBLIC_ORIGIN='https://api.example.com'
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Notes:
# - Every secret uses ${VAR:?message}, so compose aborts instead of
#   booting with defaults. There are no default passwords in this file.
# - CRYPTO_SECRET signs task artifact URLs and MUST differ from
#   SESSION_SECRET: rotating the session secret then only logs users out
#   instead of also breaking outstanding task links. If unset it falls
#   back to SESSION_SECRET (do not rely on that in production).
# - SESSION_COOKIE_SECURE=true requires local HTTPS; PUBLIC_ORIGIN must be
#   the exact public origin(s) of this deployment (comma-separated).
# - Backups: ./backups is mounted into postgres; dump with
#   docker exec postgres pg_dump -U root new-api > ./backups/manual.sql
#   and snapshot the pg_data volume on a schedule.
# - Logs DB stays on PostgreSQL by default. For high-volume logging,
#   uncomment LOG_SQL_DSN with ClickHouse per docker-compose.yml comments.

services:
  new-api:
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET to a 64+ char random string}
      - CRYPTO_SECRET=${CRYPTO_SECRET:?set CRYPTO_SECRET to a different 64+ char random string}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://api.example.com}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./backups:/backups

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  postgres:
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups

volumes:
  pg_data:
  redis_data:
